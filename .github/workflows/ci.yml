name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    name: Run TestNG Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Run Tests
        run: mvn clean test -DsuiteXmlFile=testng.xml -Denv=qa

      - name: Upload a Build Artifact
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: SureFire Report
          path: target/surefire-reports/
          retention-days: 10
